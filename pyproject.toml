[project]
name = "markmik"
version = "0.1.0"
description = "Märkmik — personal calendar and notes app"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "gunicorn",
    "markdown>=3.10.3",
    "pymdown-extensions>=12.0.1",
    "nh3",
    "pyyaml",
    "python-dateutil",
    "icalendar",
    "recurring-ical-events",
    "dateparser",
    "httpx",
    "google-api-python-client",
    "google-auth-oauthlib",
    "claude-agent-sdk",
    "cryptography",
    "tzdata",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "jedi==0.20.0",
    "matplotlib==3.11.2",
    "numpy==2.3.4",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "pyflakes==4.0.2",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` is a plain package in the repo root, not an installed distribution.
pythonpath = ["."]
markers = [
    "live: talks to a real outside service (Claude, gbrain, eKool, Google); run with -m live",
    "docker: needs the arvutus sandbox container (docker build sandbox); run with -m docker",
]
addopts = "-m 'not live and not docker'"
