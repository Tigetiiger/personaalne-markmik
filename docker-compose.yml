# Märkmik on the workstation, over Tailscale (100.122.97.7:8082). The Cloudflare Tunnel
# (docs/TUNNEL-PLAN.md) is the `tunnel` profile: `docker compose --profile tunnel up -d` once
# TUNNEL_TOKEN and PUBLIC_URL are in .env, or set COMPOSE_PROFILES=tunnel there to turn it on by
# default; plain `docker compose up -d` leaves cloudflared off either way.
# Hardening (docs/SECURITY-REVIEW.md N9): no capabilities and no privilege gain anywhere; web and
# worker run on a read-only root and write only to /data and the tmpfs /tmp (the Claude CLI's
# config and working directories are made there, app/ai/runner.py).
services:
  web:
    build: .
    image: ${COMPOSE_PROJECT_NAME}-app  # built once; the worker runs the same image
    env_file: .env
    environment:
      # Only cloudflared's fixed address may name the client (CF-Connecting-IP): app/security.py.
      TRUSTED_PROXY_NET: 172.30.85.2/32
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports:
      - "100.122.97.7:8082:8000"
    networks:                       # brainnet reaches gbrain; tunnelnet only used when cloudflared runs
      default:
      brainnet:
      tunnelnet:
        ipv4_address: 172.30.85.3
    restart: unless-stopped

  worker:
    image: ${COMPOSE_PROJECT_NAME}-app
    pull_policy: never              # web's build makes it; never look for it on a registry
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  # One `gbrain serve --http` (PGLite is single-process), indexing the app's brain clone read-only.
  # Before the first start create ./data/brain and ./data/gbrain as uid 1000, or Docker creates
  # them as root and the app cannot clone into them.
  gbrain:
    build: ./gbrain
    user: "1000:1000"
    environment:
      GBRAIN_SYNC_INTERVAL: "60"
    volumes:
      - ./data/brain:/brain:ro
      - ./data/gbrain:/data         # PGLite, config, app_token
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    expose: ["8083"]                # no host port: reachable only on brainnet
    networks: [brainnet]
    restart: unless-stopped
    stop_grace_period: 30s          # let PGLite close cleanly
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8083/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      start_period: 60s

  # Public hostname in Cloudflare -> http://web:8000. Off unless the `tunnel` profile is named.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}   # empty: cloudflared exits; without the profile it is never started
    networks:
      tunnelnet:
        ipv4_address: 172.30.85.2   # = web's TRUSTED_PROXY_NET
    depends_on: [web]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

networks:
  brainnet:
    internal: true                  # no egress: gbrain runs keyless
  # Only web and cloudflared, both at fixed addresses, so nothing else can hold cloudflared's.
  tunnelnet:
    ipam:
      config:
        - subnet: 172.30.85.0/24
